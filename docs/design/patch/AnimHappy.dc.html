<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Squircle happy animation options</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&amp;display=swap">
<style>
body{margin:0}
svg{overflow:visible}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes squish{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(0) scale(1.08,.9)}60%{transform:translateY(-8px) scale(.95,1.06)}}
@keyframes wiggle{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes spinjump{0%,15%{transform:translateY(0) rotate(0deg) scale(1,1)}22%{transform:translateY(0) rotate(0deg) scale(1.08,.9)}48%{transform:translateY(-30px) rotate(180deg) scale(.96,1.04)}72%{transform:translateY(0) rotate(360deg) scale(1,1)}78%{transform:translateY(0) rotate(360deg) scale(1.08,.9)}86%,100%{transform:translateY(0) rotate(360deg) scale(1,1)}}
@keyframes spinshadow{0%,15%,72%,100%{transform:scaleX(1);opacity:.14}48%{transform:scaleX(.55);opacity:.05}}
@keyframes dance{0%,100%{transform:translateX(0) rotate(0deg)}25%{transform:translateX(-6px) rotate(-10deg)}75%{transform:translateX(6px) rotate(10deg)}}
@keyframes rise{0%{transform:translateY(8px);opacity:0}25%{opacity:1}100%{transform:translateY(-24px);opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}60%{transform:scale(1)}}
.float{animation:float 2.6s ease-in-out infinite}
.p1{animation:pulse 1.2s infinite}.p3{animation:pulse 1.2s .4s infinite}
.squish{transform-box:fill-box;transform-origin:50% 100%;animation:squish 1s ease-in-out infinite}
.wiggle-fast{transform-box:fill-box;transform-origin:50% 100%;animation:wiggle .45s ease-in-out infinite}
.spinjump{transform-box:fill-box;transform-origin:50% 50%;animation:spinjump 2.2s ease-in-out infinite}
.spinshadow{transform-box:fill-box;transform-origin:center;animation:spinshadow 2.2s ease-in-out infinite}
.dance{transform-box:fill-box;transform-origin:50% 100%;animation:dance .9s ease-in-out infinite}
.rise1{animation:rise 1.8s ease-out infinite}.rise2{animation:rise 1.8s .9s ease-out infinite}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 1120px; height: 340px; box-sizing: border-box; padding: 32px; background: #EEF0FF; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; font-family: Nunito, 'Avenir Next', 'Segoe UI', sans-serif; color: #2A2457">

<ellipse cx="44" cy="122" rx="8" ry="5" fill="#FF9EC0"></ellipse>

<div style="background: #FFFFFF; border-radius: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
<svg width="160" height="170" viewBox="0 0 160 170" role="img" aria-label="Happy option C, little dance">
<ellipse cx="80" cy="150" rx="50" ry="5" fill="#2A2457" opacity="0.12"></ellipse>

<circle cx="80" cy="19" r="7" fill="#FFC94D"></circle>
</g>
<rect x="24" y="40" width="112" height="106" rx="44" fill="#9483FF"></rect>
<ellipse cx="50" cy="60" rx="11" ry="6" fill="#FFFFFF" opacity="0.35" transform="rotate(-32 50 60)"></ellipse>

<path d="M86 92 Q93 81 100 92" stroke="#7FF0DD" stroke-width="4.5" fill="none" stroke-linecap="round"></path>
<ellipse cx="44" cy="122" rx="8" ry="5" fill="#FF9EC0"></ellipse>
<ellipse cx="116" cy="122" rx="8" ry="5" fill="#FF9EC0"></ellipse>
<path d="M73 121 Q80 129 87 121" stroke="#2A2457" stroke-width="3" fill="none" stroke-linecap="round"></path>
</g>

<div style="text-align: center"><div style="font-size: 16px; font-weight: 800">C · Dance</div><div style="font-size: 13px; font-weight: 600; color: #6B6890">sways side to side, music notes</div></div>
</div>

<div style="background: #FFFFFF; border-radius: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
<svg width="160" height="170" viewBox="0 0 160 170" role="img" aria-label="Happy option D, heart eyes">
<ellipse cx="80" cy="160" rx="46" ry="5" fill="#2A2457" opacity="0.12"></ellipse>

<ellipse cx="44" cy="122" rx="9" ry="5.5" fill="#FF9EC0"></ellipse>
