<!doctype html>
<html lang="en" data-design="playful">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patch, the LLM-security assistant</title>
    <!-- Fonts from the head, not from JavaScript, so the first frame already asks for them (DESIGN.md §3.4). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
    />
    <script>
      // Light or dark before the first paint, so a dark page never flashes light (DESIGN.md §9).
      // Order: ?theme= in the URL, then the saved choice, then the system. src/theme.ts reads the result.
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('theme')
        } catch (e) {
          /* blocked storage (private windows): fall through to the system setting */
        }
        var value = new URLSearchParams(location.search).get('theme') || saved
        if (value !== 'light' && value !== 'dark') {
          value = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = value
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
