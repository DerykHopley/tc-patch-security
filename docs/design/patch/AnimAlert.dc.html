<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Squircle alert animation options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&amp;display=swap">
<style>
body{margin:0}
svg{overflow:visible}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
@keyframes startle{0%,55%,100%{transform:translateY(0) scale(1,1)}60%{transform:translateY(0) scale(1.1,.86)}68%{transform:translateY(-24px) scale(.9,1.12)}78%{transform:translateY(0) scale(1.08,.9)}84%{transform:translateY(0) scale(.97,1.03)}90%{transform:translateY(0) scale(1,1)}}
@keyframes startleshadow{0%,60%,78%,100%{transform:scaleX(1);opacity:.14}68%{transform:scaleX(.6);opacity:.05}}
@keyframes siren{0%,49%{fill:#FF4D6D}50%,100%{fill:#FFC94D}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes halo{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.45;transform:scale(1.25)}}
@keyframes pop{0%,8%{transform:scale(0)}18%{transform:scale(1.3)}26%{transform:scale(1)}80%{transform:scale(1)}90%,100%{transform:scale(0)}}
@keyframes freeze{0%,8%{transform:scale(1,1)}16%{transform:scale(.9,1.12)}26%,80%{transform:scale(.95,1.06)}90%,100%{transform:scale(1,1)}}
@keyframes widen{0%,8%{transform:scale(.7)}16%,80%{transform:scale(1.1)}90%,100%{transform:scale(.7)}}
.shake{animation:shake .5s infinite}
.startle{transform-box:fill-box;transform-origin:50% 100%;animation:startle 2.4s ease-in-out infinite}
.startleshadow{transform-box:fill-box;transform-origin:center;animation:startleshadow 2.4s ease-in-out infinite}
.siren{animation:siren .6s infinite}
.beam{transform-box:view-box;transform-origin:80px 19px;animation:spin 1.2s linear infinite}
.halo{transform-box:fill-box;transform-origin:center;animation:halo .6s ease-in-out infinite}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop 2.6s ease-in-out infinite}
.freeze{transform-box:fill-box;transform-origin:50% 100%;animation:freeze 2.6s ease-in-out infinite}
.widen{transform-box:fill-box;transform-origin:center;animation:widen 2.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 1120px; height: 340px; box-sizing: border-box; padding: 32px; background: #EEF0FF; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; font-family: Nunito, 'Avenir Next', 'Segoe UI', sans-serif; color: #2A2457">

<path d="M48 24 L55 33 M34 38 L44 42 M112 24 L105 33 M126 38 L116 42" stroke="#FF6B8E" stroke-width="4" stroke-linecap="round"></path>
<g transform="translate(80 146) scale(0.94 1.06) translate(-80 -146)">

<circle cx="80" cy="19" r="7" fill="#FF6B8E"></circle>
<rect x="24" y="40" width="112" height="106" rx="44" fill="#9483FF"></rect>

<rect x="44" y="68" width="72" height="40" rx="20" fill="#2A2457"></rect>
<circle cx="66" cy="88" r="9" fill="#7FF0DD"></circle>
<circle cx="94" cy="88" r="9" fill="#7FF0DD"></circle>
<circle cx="69" cy="85" r="3" fill="#FFFFFF"></circle>
<circle cx="97" cy="85" r="3" fill="#FFFFFF"></circle>
<circle cx="80" cy="125" r="4" stroke="#2A2457" stroke-width="3" fill="none"></circle>
</g>
</g>
</svg>
<div style="text-align: center"><div style="font-size: 16px; font-weight: 800">A · Shake (current)</div><div style="font-size: 13px; font-weight: 600; color: #6B6890">stretches tall, trembles</div></div>
</div>

<div style="background: #FFFFFF; border-radius: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">

<line x1="80" y1="42" x2="80" y2="22" stroke="#9483FF" stroke-width="5" stroke-linecap="round"></line>

<rect x="24" y="40" width="112" height="106" rx="44" fill="#9483FF"></rect>
<ellipse cx="50" cy="60" rx="11" ry="6" fill="#FFFFFF" opacity="0.35" transform="rotate(-32 50 60)"></ellipse>
<rect x="44" y="68" width="72" height="40" rx="20" fill="#2A2457"></rect>
<circle cx="66" cy="88" r="9" fill="#7FF0DD"></circle>
<circle cx="94" cy="88" r="9" fill="#7FF0DD"></circle>
<circle cx="66" cy="88" r="3.5" fill="#2A2457"></circle>
<circle cx="94" cy="88" r="3.5" fill="#2A2457"></circle>
<ellipse cx="80" cy="126" rx="4" ry="5" fill="#2A2457"></ellipse>
</g>
</g>
</svg>
<div style="text-align: center"><div style="font-size: 16px; font-weight: 800">B · Startle jump</div><div style="font-size: 13px; font-weight: 600; color: #6B6890">jolts up, pinprick pupils</div></div>
</div>

<div style="background: #FFFFFF; border-radius: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
<svg width="160" height="170" viewBox="0 0 160 170" role="img" aria-label="Alert option C, siren antenna">
<ellipse cx="80" cy="150" rx="50" ry="5" fill="#2A2457" opacity="0.12"></ellipse>
<g class="beam">
<path d="M80 19 L66 -14 L94 -14 Z" fill="#FF4D6D" opacity="0.3"></path>
<path d="M80 19 L47 5 L47 33 Z" fill="#FFC94D" opacity="0.3"></path>
<path d="M80 19 L113 5 L113 33 Z" fill="#FFC94D" opacity="0.3"></path>
</g>
<circle class="halo" cx="80" cy="19" r="13" fill="#FF4D6D"></circle>
<line x1="80" y1="42" x2="80" y2="22" stroke="#9483FF" stroke-width="5" stroke-linecap="round"></line>
<circle class="siren" cx="80" cy="19" r="7" fill="#FF4D6D"></circle>
<rect x="24" y="40" width="112" height="106" rx="44" fill="#9483FF"></rect>
<ellipse cx="50" cy="60" rx="11" ry="6" fill="#FFFFFF" opacity="0.35" transform="rotate(-32 50 60)"></ellipse>
<rect x="44" y="68" width="72" height="40" rx="20" fill="#2A2457"></rect>
<circle cx="66" cy="88" r="9" fill="#7FF0DD"></circle>
<circle cx="94" cy="88" r="9" fill="#7FF0DD"></circle>
<circle cx="69" cy="85" r="3" fill="#FFFFFF"></circle>
<circle cx="97" cy="85" r="3" fill="#FFFFFF"></circle>
<path d="M74 126 L86 126" stroke="#2A2457" stroke-width="3" stroke-linecap="round"></path>
</svg>
<div style="text-align: center"><div style="font-size: 16px; font-weight: 800">C · Siren</div><div style="font-size: 13px; font-weight: 600; color: #6B6890">antenna flashes &amp; spins</div></div>
</div>

<div style="background: #FFFFFF; border-radius: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
<svg width="160" height="170" viewBox="0 0 160 170" role="img" aria-label="Alert option D, exclamation pop">
<ellipse cx="80" cy="150" rx="50" ry="5" fill="#2A2457" opacity="0.12"></ellipse>
<g class="pop">
<circle cx="130" cy="30" r="15" fill="#FF4D6D"></circle>
<rect x="128" y="20" width="4.5" height="12" rx="2.25" fill="#FFFFFF"></rect>
<circle cx="130.25" cy="37.5" r="2.5" fill="#FFFFFF"></circle>
</g>
<g class="freeze">
<line x1="80" y1="42" x2="80" y2="22" stroke="#9483FF" stroke-width="5" stroke-linecap="round"></line>
<circle cx="80" cy="19" r="7" fill="#FF6B8E"></circle>
<rect x="24" y="40" width="112" height="106" rx="44" fill="#9483FF"></rect>
<ellipse cx="50" cy="60" rx="11" ry="6" fill="#FFFFFF" opacity="0.35" transform="rotate(-32 50 60)"></ellipse>
<rect x="44" y="68" width="72" height="40" rx="20" fill="#2A2457"></rect>
<circle class="widen" cx="66" cy="88" r="9" fill="#7FF0DD"></circle>
<circle class="widen" cx="94" cy="88" r="9" fill="#7FF0DD"></circle>
<circle cx="80" cy="125" r="4" stroke="#2A2457" stroke-width="3" fill="none"></circle>
</g>
</svg>
<div style="text-align: center"><div style="font-size: 16px; font-weight: 800">D · Pop-up "!"</div><div style="font-size: 13px; font-weight: 600; color: #6B6890">freezes, badge pops in</div></div>
</div>

</div>

</html>
