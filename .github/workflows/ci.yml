# Tests: no committed conflict markers, backend tests, type check, lint, the fixed-wait check, the browser check in
# Firefox and Chromium, and the container image's smoke test (B12).
# FakeLLM and a throwaway state file: no keys, no secrets, no network calls from the app. proto/ is frozen and not
# checked here.
#
# Once per commit (#56, retro finding 2):
# - A push to main or spec-* runs here. Every push keeps its own run: a later push doesn't cancel it, so each
#   commit on an integration branch keeps its verdict.
# - A pull request runs here only from other branches. A pull request from main or spec-* (e.g. spec-a into main)
#   would repeat its push run, so its jobs are skipped. A newer push to such a pull request cancels the older run.
# - Other branches run nothing on a push: open a pull request.
# - When a push (or a pull request, against its base) changes only docs (docs/**, *.md at the root), the browser
#   check and the container smoke test are skipped. The backend tests and the type check still run: they're
#   quick, and docs/report/ is built by backend code. Markdown elsewhere (e.g. the knowledge base in backend/)
#   isn't docs and runs everything.
name: CI

on:
  push:
    branches: [main, "spec-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  # Integration branches: a group per run, so nothing is cancelled or dropped from the queue.
  group: ci-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/spec-')) && github.run_id || 'latest' }}
  cancel-in-progress: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/spec-')) }}

jobs:
  changes:
    name: What changed
    # Skips a pull request from an integration branch: its push run already checks the same commit.
    if: github.event_name == 'push' || !(github.head_ref == 'main' || startsWith(github.head_ref, 'spec-'))
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          # A push: what this push added. A pull request: everything since it left its base.
          RANGE: ${{ github.event_name == 'push' && format('{0}..{1}', github.event.before, github.sha) || format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
        run: |
          # A new branch (before = 000...), a force push past history we can't see, or no files: run everything.
          if files="$(git diff --name-only "$RANGE")" && [ -n "$files" ] \
              && ! grep -qvE '^docs/|^[^/]+\.md$' <<<"$files"; then
            echo "docs_only=true" >>"$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >>"$GITHUB_OUTPUT"
          fi
          echo "Changed in $RANGE:"
          echo "${files:-(could not compare: running everything)}"
      # A merge once committed its conflict markers (backend/.env.example, spec B) and every job still passed.
      # `=======` alone isn't checked: Markdown uses it to underline headings.
      - name: No merge conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)( |$)'; then
            echo "::error::Merge conflict markers are committed (lines above)."
            exit 1
          fi

  backend:
    name: Backend tests
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run pytest
      # The evaluation report from FakeLLM and two fake embedders (A12): proves it builds, and shows the layout
      - run: uv run python -m app.evals fake-report --out ${{ runner.temp }}/model-check-report.html
      - uses: actions/upload-artifact@v7
        with:
          name: model-check-report
          path: ${{ runner.temp }}/model-check-report.html

  frontend:
    name: Type check and lint
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test # unit tests (node --test): Patch's pose pick
      # A fixed wait in the browser check needs '# allowed: <reason>' on its line (#56). Standard library only.
      - run: python3 e2e/check_waits.py

  browser:
    name: Browser check (Firefox and Chromium)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: uv run --locked --project frontend/e2e playwright install --with-deps firefox chromium
      - run: frontend/e2e/run.sh
        env:
          E2E_LOG_DIR: ${{ runner.temp }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs
          path: ${{ runner.temp }}/*.log

  container:
    name: Container image (build and smoke test)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
        working-directory: backend
      - run: uv run --locked --project frontend/e2e playwright install --with-deps chromium
      # Builds the hash index and the image, starts it with FakeLLM on a free port, checks /health, the embedder
      # check and that no .env got in, then a short browser check in Chromium (test_container.py)
      - run: frontend/e2e/container.sh
