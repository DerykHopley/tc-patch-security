[project]
name = "patch-backend"
version = "0.1.0"
description = "Patch, the LLM-security assistant: backend of the real build (spec A)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "numpy>=2.5.4",
    "chromadb>=1.5",
    "langchain-openai>=1.7.1",
    "httpx>=0.27",
    "packaging>=24",
    "semver>=3.0",
    "langchain-mcp-adapters>=0.3.2",
    "mcp>=1.30.0,<2",
    "clerk-backend-api>=7.0.0,<8",
    "pyjwt>=2.9",
    "google-cloud-storage>=3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Keep only the last run's temp folders: tests' index copies (~36 MB each, ~100 a run) filled /tmp past its quota
# when several agents tested at once and pytest kept three runs (2026-10-16). Not policy "failed": deleting a
# passing test's folder frees its name for a later test, and Chroma's cached client for that path then points at
# a deleted database ("attempt to write a readonly database", CI on 1eae8d2).
tmp_path_retention_count = 1
# B28: the conftest guard fails any test that builds the real feeds (FEEDS=real is the default); a test that only
# inspects the adapter, never asks it, says so with this mark
markers = ["builds_real_feeds: the test builds the real feeds adapter but never asks it (conftest guard, B28)"]
