[project]
name = "patch-backend"
version = "0.1.0"
description = "Patch, the LLM-security assistant: backend of the real build (spec A)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "numpy>=2.5.4",
    "chromadb>=1.5",
    "langchain-openai>=1.7.1",
    "httpx>=0.27",
    "packaging>=24",
    "semver>=3.0",
    "langchain-mcp-adapters>=0.3.2",
    "mcp>=1.30.0,<2",
    "clerk-backend-api>=7.0.0,<8",
    "pyjwt>=2.9",
    "google-cloud-storage>=3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
