[project]
name = "llm-security-proto"
version = "0.1.0"
description = "Prototype: LLM-security RAG assistant backend (mock-heavy)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=2.0",
    "pydantic>=2.8",
    "openai>=1.50",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
