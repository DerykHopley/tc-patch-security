# Tests on every push and pull request: backend tests, type check, lint, and the browser check
# in Firefox and Chromium. FakeLLM and a throwaway state file: no keys, no secrets, no network calls
# from the app. proto/ is frozen and not checked here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run pytest

  frontend:
    name: Type check and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint

  browser:
    name: Browser check (Firefox and Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: uv run --locked --project frontend/e2e playwright install --with-deps firefox chromium
      - run: frontend/e2e/run.sh
        env:
          E2E_LOG_DIR: ${{ runner.temp }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs
          path: ${{ runner.temp }}/*.log
