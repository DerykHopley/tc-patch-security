# The Cloud Run service's plain settings (B13, #44). DEPLOY.md, step 6, says how to use it:
#   cp deploy/cloudrun/env.example.yaml deploy/cloudrun/env.yaml   # git-ignored; fill in the <...> values
# Nothing here is a secret. The secrets (OpenRouter, the scheduler, Tavily, ntfy) come from Secret Manager instead
# (DEPLOY.md, step 4). Every setting is explained in backend/.env.example.

# The model: OpenRouter, with the key's spending cap as the backstop
LLM_PROVIDER: openrouter
OPENROUTER_MODEL: anthropic/claude-haiku-5.5

# Live data from the real feeds, refreshed by Cloud Scheduler (DEPLOY.md, step 8)
DATA_MODE: live
FEEDS: real

# Users' state and the live data in the bucket (DEPLOY.md, step 3)
STORE: gcs
GCS_BUCKET: <PROJECT_ID>-state

# Sign-in (Clerk, #65). The JWT key is the PEM from the Clerk dashboard (API keys, "JWT public key"); keep the \n.
AUTH: "on"
CLERK_PUBLISHABLE_KEY: pk_test_<...>
CLERK_JWT_KEY: "-----BEGIN PUBLIC KEY-----\n<...>\n-----END PUBLIC KEY-----"
# Your Clerk user id (Users -> you): only your alerts go to the ntfy topic
OWNER: user_<...>

# The service's address (DEPLOY.md, step 5). Sign-in refuses tokens made on any other page.
AUTH_ALLOWED_ORIGINS: https://patch-<PROJECT_NUMBER>.us-central1.run.app
APP_URL: https://patch-<PROJECT_NUMBER>.us-central1.run.app
CORS_ORIGINS: https://patch-<PROJECT_NUMBER>.us-central1.run.app

# The Dev page shows internals (the index, the map, the saved checks) to every signed-in user; only the owner
# can change its choices (B29). Off: every /dev route is a 404 and the env defaults apply
DEV_PANEL: "false"

# Quiet hours on Settings are in this time zone
ALERT_TZ: Europe/London
