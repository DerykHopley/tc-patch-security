[project]
name = "patch-browser-check"
version = "0.1.0"
description = "The browser check (Playwright, Firefox and Chromium). Run it with frontend/e2e/run.sh."
requires-python = ">=3.12"
dependencies = [
    "pytest>=8",
    "pytest-playwright>=0.7",
    "playwright==1.63.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
# Keep a test's temp folder only when it failed, and only from the last run: passing tests' index copies
# (~36 MB each, ~100 a run) filled /tmp past its quota when several agents tested at once (2026-10-16).
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
